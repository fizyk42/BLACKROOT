name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/**'
      - 'styles/**'
      - 'assets/icon/**'
      - 'index.html'
      - 'build.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: write

concurrency:
  group: blackroot-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web bundle used by desktop app
        run: npm run build
      - name: Verify packaged game page is not empty
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path 'docs/index.html')) { throw 'docs/index.html is missing after build' }
          $size = (Get-Item 'docs/index.html').Length
          if ($size -lt 100000) { throw "docs/index.html is unexpectedly small ($size bytes)" }
          $html = Get-Content 'docs/index.html' -Raw
          if ($html -notmatch 'BLACKROOT') { throw 'docs/index.html does not contain BLACKROOT game markup' }
          if ($html -notmatch 'window.BLACKROOT|game-title|BLACKROOT ONLINE') { throw 'docs/index.html does not look like the playable build' }
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Install and validate real BLACKROOT boot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem release/BLACKROOT-Setup-*-x64.exe | Select-Object -First 1).FullName
          if (!$setup) { throw 'Installer was not created' }
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs/BLACKROOT'
          $installer = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $game = Join-Path $installDir 'BLACKROOT.exe'
          if (!(Test-Path $game)) { throw 'Installed executable is missing' }

          $report = Join-Path $env:TEMP 'blackroot-smoke.json'
          if (Test-Path $report) { Remove-Item $report -Force }
          $args = @('--smoke-test', "--smoke-report=$report")
          $process = Start-Process -FilePath $game -ArgumentList $args -PassThru
          if (-not $process.WaitForExit(300000)) {
            try { Stop-Process -Id $process.Id -Force } catch {}
            throw 'BLACKROOT smoke test timed out'
          }
          if (!(Test-Path $report)) { throw 'BLACKROOT did not write a smoke-test report' }
          $smoke = Get-Content $report -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0) { throw "BLACKROOT smoke test exited with code $($process.ExitCode): $($smoke.errors -join '; ')" }
          if (-not $smoke.passed) { throw "BLACKROOT smoke test reported failure: $($smoke.errors -join '; ')" }
          if (-not $smoke.checks.boot) { throw 'BLACKROOT never initialized window.BLACKROOT' }
          if (-not $smoke.checks.play) { throw 'BLACKROOT did not reach a playable rendered state' }

          $releaseReport = @{
            passed = $true
            installer = (Split-Path $setup -Leaf)
            executable = 'BLACKROOT.exe'
            install = 'success'
            boot = 'success'
            gameplay = 'success'
            packagedHtmlBytes = (Get-Item 'docs/index.html').Length
            onlineServer = 'wss://blackroot-server-production.up.railway.app/net'
            smoke = $smoke
          } | ConvertTo-Json -Depth 8
          $releaseReport | Set-Content release/desktop-test-report.json

          $uninstaller = Join-Path $installDir 'Uninstall BLACKROOT.exe'
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
          }
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version-windows.${{ github.run_number }}"
          $installer = (Get-ChildItem release/BLACKROOT-Setup-*-x64.exe | Select-Object -First 1).FullName
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content release/SHA256SUMS.txt
          gh release create $tag $installer release/SHA256SUMS.txt release/desktop-test-report.json --target "${{ github.sha }}" --title "BLACKROOT $version for Windows" --notes-file desktop/RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
      - name: Keep build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLACKROOT-Windows
          path: |
            release/BLACKROOT-Setup-*-x64.exe
            release/SHA256SUMS.txt
            release/desktop-test-report.json
