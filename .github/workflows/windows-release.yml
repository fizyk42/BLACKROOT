name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/**'
      - 'styles/**'
      - 'assets/icon/**'
      - 'index.html'
      - 'build.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.yml'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: write

concurrency:
  group: blackroot-windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build game and Windows installer
        run: npm run desktop:dist
      - name: Install and validate Windows game
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem release/BLACKROOT-Setup-*-x64.exe | Select-Object -First 1).FullName
          if (!$setup) { throw 'Installer was not created' }
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs/BLACKROOT'
          $installer = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $game = Join-Path $installDir 'BLACKROOT.exe'
          if (!(Test-Path $game)) { throw 'Installed executable is missing' }

          $process = Start-Process -FilePath $game -PassThru
          Start-Sleep -Seconds 20
          if ($process.HasExited) { throw "BLACKROOT exited during launch validation with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

          $report = @{
            passed = $true
            installer = (Split-Path $setup -Leaf)
            executable = 'BLACKROOT.exe'
            install = 'success'
            launch = 'success'
            onlineServer = 'wss://blackroot-server-production.up.railway.app/net'
          } | ConvertTo-Json
          $report | Set-Content release/desktop-test-report.json

          $uninstaller = Join-Path $installDir 'Uninstall BLACKROOT.exe'
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait
          }
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version-windows.${{ github.run_number }}"
          $installer = (Get-ChildItem release/BLACKROOT-Setup-*-x64.exe | Select-Object -First 1).FullName
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content release/SHA256SUMS.txt
          gh release create $tag $installer release/SHA256SUMS.txt release/desktop-test-report.json --target "${{ github.sha }}" --title "BLACKROOT $version for Windows" --notes-file desktop/RELEASE-NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
      - name: Keep build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLACKROOT-Windows
          path: |
            release/BLACKROOT-Setup-*-x64.exe
            release/SHA256SUMS.txt
            release/desktop-test-report.json
