<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0e141b"/>
    <stop offset="0.62" stop-color="#080b0e"/>
    <stop offset="1" stop-color="#040506"/>
  </linearGradient>
  <radialGradient id="vig" cx="0.5" cy="0.40" r="0.72">
    <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.72"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff4dc" stop-opacity="0.8"/>
    <stop offset="0.30" stop-color="#e6c68d" stop-opacity="0.46"/>
    <stop offset="0.74" stop-color="#c0a15a" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#c0a15a" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#e6c68d" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#e6c68d" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="lens" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fffaf0" stop-opacity="1"/>
    <stop offset="0.35" stop-color="#fff4dc" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#fff4dc" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#c0a15a" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#c0a15a" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#c0a15a" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="12"/>
  </filter>
  <clipPath id="squircle">
    <rect x="0" y="0" width="512" height="512" rx="114" ry="114"/>
  </clipPath>
</defs>

<g clip-path="url(#squircle)">
  <rect width="512" height="512" fill="url(#sky)"/>
  

  <!-- lamp beam -->
  <path d="M226 52C218 172 114 336 88 486L424 486C398 336 294 172 286 52Z" fill="url(#beam)" filter="url(#softer)" opacity="0.55"/>
  <path d="M226 52C218 172 114 336 88 486L424 486C398 336 294 172 286 52Z" fill="url(#beam)" filter="url(#soft)"/>

  <!-- pool of light on the ground -->
  <ellipse cx="256" cy="386" rx="158" ry="40" fill="url(#pool)" filter="url(#soft)"/>

  <!-- the lens itself -->
  <circle cx="256" cy="54" r="34" fill="url(#lens)" filter="url(#soft)"/>
  <circle cx="256" cy="54" r="13" fill="#fffdf6"/>

  <!-- ground line: the boundary between branch and root -->
  <rect x="74" y="369" width="364" height="6" fill="url(#horizon)"/>

  <!-- roots, then canopy: rim pass keeps them readable outside the beam -->
  <g>
    <path d="M256.0 372.0L164.0 446.0" stroke="#26303b" stroke-width="41.00" stroke-linecap="round" fill="none" opacity="0.95"/><path d="M256.0 372.0L350.0 440.0" stroke="#26303b" stroke-width="41.00" stroke-linecap="round" fill="none" opacity="0.95"/><path d="M256.0 372.0L258.0 464.0" stroke="#26303b" stroke-width="33.00" stroke-linecap="round" fill="none" opacity="0.95"/><path d="M196.0 410.0L140.0 468.0" stroke="#26303b" stroke-width="25.00" stroke-linecap="round" fill="none" opacity="0.95"/><path d="M316.0 406.0L372.0 464.0" stroke="#26303b" stroke-width="25.00" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M256.0 372.0L256.0 168.0" stroke="#26303b" stroke-width="53.00" stroke-linecap="round" fill="none" opacity="0.95"/><path d="M252.0 262.0L168.0 176.0" stroke="#26303b" stroke-width="37.00" stroke-linecap="round" fill="none" opacity="0.95"/><path d="M260.0 276.0L344.0 190.0" stroke="#26303b" stroke-width="37.00" stroke-linecap="round" fill="none" opacity="0.95"/><path d="M254.0 200.0L198.0 138.0" stroke="#26303b" stroke-width="27.00" stroke-linecap="round" fill="none" opacity="0.95"/><path d="M258.0 192.0L318.0 132.0" stroke="#26303b" stroke-width="27.00" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M256.0 372.0L164.0 446.0" stroke="#04050a" stroke-width="34.00" stroke-linecap="round" fill="none"/><path d="M256.0 372.0L350.0 440.0" stroke="#04050a" stroke-width="34.00" stroke-linecap="round" fill="none"/><path d="M256.0 372.0L258.0 464.0" stroke="#04050a" stroke-width="26.00" stroke-linecap="round" fill="none"/><path d="M196.0 410.0L140.0 468.0" stroke="#04050a" stroke-width="18.00" stroke-linecap="round" fill="none"/><path d="M316.0 406.0L372.0 464.0" stroke="#04050a" stroke-width="18.00" stroke-linecap="round" fill="none"/>
    <path d="M256.0 372.0L256.0 168.0" stroke="#04050a" stroke-width="46.00" stroke-linecap="round" fill="none"/><path d="M252.0 262.0L168.0 176.0" stroke="#04050a" stroke-width="30.00" stroke-linecap="round" fill="none"/><path d="M260.0 276.0L344.0 190.0" stroke="#04050a" stroke-width="30.00" stroke-linecap="round" fill="none"/><path d="M254.0 200.0L198.0 138.0" stroke="#04050a" stroke-width="20.00" stroke-linecap="round" fill="none"/><path d="M258.0 192.0L318.0 132.0" stroke="#04050a" stroke-width="20.00" stroke-linecap="round" fill="none"/>
  </g>

  <!-- moonlit edge on the trunk, so the silhouette has a light source -->
  <path d="M240 372 L240 254" stroke="#9fb6d8" stroke-width="5" stroke-linecap="round" opacity="0.34"/>

  <rect width="512" height="512" fill="url(#vig)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="112.5" ry="112.5"
        fill="none" stroke="#7a6636" stroke-width="3" opacity="0.55"/>
</g>
</svg>